[workspace]
resolver = "2"
members = [
    "crates/dtwin-core",
    "crates/dtwin-chip",
    "crates/dtwin-gdb",
    "crates/dtwin-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/frisky1985/yuleDriverTwin"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
object = "0.36"
gdbstub = "0.7"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
